<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial; background:#f5f7fb; padding:20px; }

        .card {
            max-width:600px;
            margin:auto;
            background:#fff;
            padding:30px;
            border-radius:12px;
        }

        .header {
            color:#16a34a;
            font-size:22px;
            font-weight:bold;
        }

        .badge {
            background:#dcfce7;
            color:#166534;
            padding:6px 12px;
            border-radius:20px;
            font-size:12px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="header">
        Refund Completed 💰
    </div>

    <div class="badge">
        Amount Returned
    </div>

    <p>
        Hi {{ order.user.first_name|default:"Customer" }},
    </p>

    <p>
        Your refund has been successfully processed.
        It will reflect in your account within 3–5 business days.
    </p>

    <p>
        Order ID: <b>{{ order.order_id }}</b>
    </p>

</div>

</body>
</html>
