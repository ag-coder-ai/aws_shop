<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial; background:#f5f7fb; padding:20px; }

        .card {
            max-width:600px;
            margin:auto;
            background:#fff;
            padding:30px;
            border-radius:12px;
        }

        .header {
            color:#f59e0b;
            font-size:22px;
            font-weight:bold;
        }

        .badge {
            background:#fef3c7;
            color:#92400e;
            padding:6px 12px;
            border-radius:20px;
            font-size:12px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="header">
        Item Received at Warehouse 🏬
    </div>

    <div class="badge">
        Under Quality Check
    </div>

    <p>
        Hi {{ order.user.first_name|default:"Customer" }},
    </p>

    <p>
        We have received your returned product and it is under quality inspection.
    </p>

    <p>
        Order ID: <b>{{ order.order_id }}</b>
    </p>

</div>

</body>
</html>
