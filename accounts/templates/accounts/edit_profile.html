
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Profile | FashionHub</title>

    <style>

    /* =========================================
       PAGE ONLY STYLES
       (DO NOT RESET NAVBAR STYLES)
    ========================================= */

    body{
        background:#f4f6f9;
        color:#111827;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;

        overflow-x:clip;

        /* navbar safe spacing */
        padding-top:82px;
    }

    /* =========================================
       PAGE WRAPPER
    ========================================= */

    .edit-profile-page{
        width:100%;
        min-height:calc(100vh - 82px);

        display:flex;
        justify-content:center;
        align-items:flex-start;

        padding:24px 16px 40px;
    }

    /* =========================================
       CARD
    ========================================= */

    .box{
        width:100%;
        max-width:520px;

        background:#ffffff;

        border-radius:22px;

        padding:30px;

        box-shadow:
            0 10px 30px rgba(0,0,0,0.06),
            0 2px 10px rgba(0,0,0,0.04);

        animation:fadeUp .35s ease;
    }

    /* =========================================
       TITLE
    ========================================= */

    .box h2{
        font-size:24px;
        font-weight:800;

        margin-bottom:22px;

        color:#111827;
    }

    /* =========================================
       FORM GROUP
    ========================================= */

    .form-group{
        margin-bottom:18px;
    }

    /* =========================================
       LABEL
    ========================================= */

    label{
        display:block;

        font-size:12px;
        font-weight:700;

        color:#6b7280;

        margin-bottom:8px;

        text-transform:uppercase;
        letter-spacing:.5px;
    }

    /* =========================================
       INPUT
    ========================================= */

    input{
        width:100%;

        padding:14px 15px;

        border:
            1.5px solid #e5e7eb;

        border-radius:14px;

        font-size:14px;

        background:#ffffff;

        color:#111827;

        outline:none;

        transition:.25s ease;
    }

    input::placeholder{
        color:#9ca3af;
    }

    input:focus{
        border-color:#111827;

        box-shadow:
            0 0 0 4px rgba(17,24,39,0.08);
    }

    /* =========================================
       BUTTON
    ========================================= */

    .save-btn{
        width:100%;

        display:flex;
        align-items:center;
        justify-content:center;

        margin-top:8px;

        padding:15px;

        border:none;
        border-radius:16px;

        background:
            linear-gradient(
                135deg,
                #f59e0b,
                #fbbf24
            );

        color:#111827;

        font-size:14px;
        font-weight:800;

        cursor:pointer;

        transition:.25s ease;

        box-shadow:
            0 10px 25px rgba(245,158,11,0.18);
    }

    .save-btn:hover{
        transform:translateY(-2px);

        background:#111827;

        color:#ffffff;
    }

    .save-btn:active{
        transform:scale(.98);
    }

    /* =========================================
       TABLET
    ========================================= */

    @media(max-width:768px){

        body{
            padding-top:78px;
        }

        .edit-profile-page{
            padding:20px 14px 30px;
        }

        .box{
            padding:24px;

            border-radius:18px;
        }

        .box h2{
            font-size:21px;
        }

        input{
            padding:13px 14px;

            font-size:14px;
        }

        .save-btn{
            padding:14px;

            font-size:13px;
        }
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media(max-width:480px){

        body{
            padding-top:74px;
        }

        .edit-profile-page{
            padding:14px 12px 24px;
        }

        .box{
            padding:18px;

            border-radius:16px;
        }

        .box h2{
            font-size:18px;

            margin-bottom:18px;
        }

        .form-group{
            margin-bottom:16px;
        }

        label{
            font-size:11px;
        }

        input{
            padding:12px 13px;

            border-radius:12px;

            font-size:13px;
        }

        .save-btn{
            padding:13px;

            border-radius:14px;

            font-size:13px;
        }
    }

    /* =========================================
       EXTRA SMALL DEVICES
    ========================================= */

    @media(max-width:360px){

        .box{
            padding:16px;
        }

        input{
            font-size:12px;
        }

        .save-btn{
            font-size:12px;
        }
    }

    /* =========================================
       ANIMATION
    ========================================= */

    @keyframes fadeUp{

        from{
            opacity:0;
            transform:translateY(18px);
        }

        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    </style>

</head>

<body>

    {% include "partials/navbar.html" %}

    <div class="edit-profile-page">

        <div class="box">

            <h2>Edit Profile</h2>

            <form method="POST">

                {% csrf_token %}

                <!-- FULL NAME -->

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="full_name"
                        value="{{ request.user.full_name|default_if_none:'' }}"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        value="{{ request.user.email }}"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <!-- PHONE -->

                <div class="form-group">

                    <label>
                        Phone
                    </label>

                    <input
                        type="text"
                        name="phone"
                        value="{{ profile.phone|default_if_none:'' }}"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>

                <!-- BUTTON -->

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Changes
                </button>

            </form>

        </div>

    </div>

</body>

</html>
