{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Email Sent | FashionHub</title>

<style>
    /* RESET */
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: Arial, sans-serif;
}

body {
background: linear-gradient(135deg, #111827, #1f2937);
height: 100vh;
display: flex;
align-items: center;
justify-content: center;
}

/* CONTAINER */
.reset-container {
display: flex;
align-items: center;
justify-content: center;
width: 100%;
}

/* CARD */
.reset-card {
background: white;
padding: 40px;
border-radius: 16px;
text-align: center;
max-width: 420px;
width: 100%;
box-shadow: 0 15px 40px rgba(0,0,0,0.2);
animation: fadeUp 0.5s ease;
}

/* ICON */
.icon {
width: 70px;
height: 70px;
margin: 0 auto 20px;
background: #16a34a;
color: white;
font-size: 32px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-weight: bold;
}

/* TITLE */
.reset-card h2 {
font-size: 26px;
margin-bottom: 15px;
color: #111827;
}

/* TEXT */
.reset-card p {
font-size: 14px;
color: #6b7280;
line-height: 1.6;
margin-bottom: 20px;
}

/* INFO BOX */
.info-box {
background: #ecfdf5;
color: #065f46;
padding: 10px;
border-radius: 8px;
font-size: 13px;
margin-bottom: 25px;
}

/* BUTTON */
.btn {
display: inline-block;
padding: 12px 20px;
background: #f59e0b;
color: black;
text-decoration: none;
border-radius: 8px;
font-weight: 600;
transition: 0.3s;
}

.btn:hover {
background: #111827;
color: white;
}

/* ANIMATION */
@keyframes fadeUp {
from {
opacity: 0;
transform: translateY(20px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

/* RESPONSIVE */
@media (max-width: 480px) {
.reset-card {
padding: 25px;
}
}

</style>

</head>

<body>

<div class="reset-container">

    <div class="reset-card">

        <!-- ICON -->
        <div class="icon">
            ✔
        </div>

        <!-- TITLE -->
        <h2>Check Your Email</h2>

        <!-- MESSAGE -->
        <p>
            If an account exists with this email, we’ve sent
            instructions to reset your password.
            <br><br>
            Please check your inbox and spam folder.
        </p>

        <!-- INFO BOX -->
        <div class="info-box">
            📩 Email sent successfully
        </div>

        <!-- ACTION -->
        <a href="{% url 'login' %}" class="btn">
            Back to Login
        </a>

    </div>

</div>

</body>

</html>
