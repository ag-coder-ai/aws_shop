{% load static %}

<!DOCTYPE html>
<html>

<head>

<title>My Profile | FashionHub</title>

<style>
    * {
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body {
background:linear-gradient(135deg,#111827,#1f2937);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* CARD */
.profile-wrapper {
width:100%;
padding:20px;
display:flex;
justify-content:center;
}

.profile-card {
background:white;
width:100%;
max-width:500px;
border-radius:16px;
padding:30px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
animation:fadeUp 0.4s ease;
}

/* HEADER */
.profile-header {
display:flex;
align-items:center;
gap:15px;
margin-bottom:25px;
}

.avatar {
width:60px;
height:60px;
background:#f59e0b;
color:black;
font-size:24px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
font-weight:bold;
}

.profile-header h2 {
font-size:20px;
color:#111827;
}

.profile-header p {
font-size:13px;
color:#6b7280;
}

/* DETAILS */
.profile-details {
margin-top:20px;
}

.info-row {
margin-bottom:18px;
padding-bottom:10px;
border-bottom:1px solid #e5e7eb;
}

.info-row label {
font-size:12px;
color:#6b7280;
display:block;
margin-bottom:4px;
}

.info-row p {
font-size:15px;
color:#111827;
font-weight:500;
}

/* BUTTON */
.profile-actions {
margin-top:25px;
text-align:center;
}

.btn {
display:inline-block;
padding:10px 18px;
background:#f59e0b;
color:black;
text-decoration:none;
border-radius:8px;
font-weight:600;
transition:0.3s;
}

.btn:hover {
background:#111827;
color:white;
}

/* ANIMATION */
@keyframes fadeUp {
from {
opacity:0;
transform:translateY(20px);
}
to {
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="profile-wrapper">

    <div class="profile-card">

        <!-- HEADER -->
        <div class="profile-header">

            <div class="avatar">
                {{ user.full_name|first }}
            </div>

            <div>
                <h2>{{ user.full_name }}</h2>
                <p>Account Overview</p>
            </div>

        </div>

        <!-- DETAILS -->
        <div class="profile-details">

            <div class="info-row">
                <label>Full Name</label>
                <p>{{ user.full_name }}</p>
            </div>

            <div class="info-row">
                <label>Email Address</label>
                <p>{{ user.email }}</p>
            </div>

            <div class="info-row">
                <label>Phone Number</label>
                <p>{{ user.phone }}</p>
            </div>
        </div>

        <!-- ACTION -->
        <div class="profile-actions">
<a href="{% url 'edit_profile' %}" class="btn">Edit Profile</a>
        </div>

    </div>

</div>

</body>

</html>
