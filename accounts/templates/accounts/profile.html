
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile | FashionHub</title>

    <style>

    body{
        background:#f4f6f9;
        color:#111827;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;

        overflow-x:clip;

        padding-top:75px;
    }

    /* =========================
       PAGE WRAPPER
    ========================= */

    .profile-page{
        width:100%;
        min-height:calc(100vh - 75px);

        display:flex;
        justify-content:center;
        align-items:flex-start;

        padding:28px 18px;
    }

    /* =========================
       PROFILE CARD
    ========================= */

    .profile-card{
        width:100%;
        max-width:580px;

        background:#ffffff;

        border-radius:22px;

        padding:30px;

        box-shadow:
            0 10px 35px rgba(0,0,0,0.06);

        animation:fadeUp .35s ease;
    }

    /* =========================
       PROFILE HEADER
    ========================= */

    .profile-header{
        display:flex;
        align-items:center;

        gap:16px;

        margin-bottom:28px;
    }

    .avatar{
        width:70px;
        height:70px;

        border-radius:50%;

        background:
            linear-gradient(
                135deg,
                #f59e0b,
                #fbbf24
            );

        display:flex;
        align-items:center;
        justify-content:center;

        font-size:24px;
        font-weight:800;

        color:#111827;

        flex-shrink:0;
    }

    .profile-header h2{
        font-size:22px;
        font-weight:700;

        margin-bottom:4px;

        word-break:break-word;
    }

    .profile-header p{
        font-size:13px;
        color:#6b7280;
    }

    /* =========================
       DETAILS
    ========================= */

    .info-row{
        padding:16px 0;

        border-bottom:
            1px solid #edf0f4;
    }

    .info-row:last-child{
        border-bottom:none;
    }

    .info-row label{
        display:block;

        font-size:12px;
        font-weight:600;

        color:#6b7280;

        margin-bottom:6px;

        text-transform:uppercase;

        letter-spacing:.5px;
    }

    .info-row p{
        font-size:15px;
        font-weight:600;

        word-break:break-word;
    }

    /* =========================
       BUTTON
    ========================= */

    .profile-actions{
        margin-top:26px;
    }

    .btn{
        width:100%;

        display:flex;
        align-items:center;
        justify-content:center;

        padding:15px;

        border-radius:14px;

        text-decoration:none;

        font-size:14px;
        font-weight:700;

        background:
            linear-gradient(
                135deg,
                #f59e0b,
                #fbbf24
            );

        color:#111827;

        transition:0.25s ease;
    }

    .btn:hover{
        transform:translateY(-2px);
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:768px){

        body{
            padding-top:70px;
        }

        .profile-page{
            padding:18px 14px;
        }

        .profile-card{
            padding:22px;
            border-radius:18px;
        }

        .avatar{
            width:60px;
            height:60px;

            font-size:21px;
        }
    }

    @media(max-width:480px){

        .profile-page{
            padding:14px 12px;
        }

        .profile-card{
            padding:18px;
            border-radius:16px;
        }

        .profile-header{
            align-items:flex-start;
        }

        .profile-header h2{
            font-size:18px;
        }

        .info-row p{
            font-size:13px;
        }

        .btn{
            padding:13px;
            font-size:13px;
        }
    }

    @keyframes fadeUp{

        from{
            opacity:0;
            transform:translateY(18px);
        }

        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    </style>

</head>

<body>

    {% include "partials/navbar.html" %}

    <div class="profile-page">

        <div class="profile-card">

            <div class="profile-header">

                <div class="avatar">
                    {{ user.full_name|first }}
                </div>

                <div>
                    <h2>{{ user.full_name }}</h2>
                    <p>Account Overview</p>
                </div>

            </div>

            <div class="profile-details">

                <div class="info-row">
                    <label>Full Name</label>
                    <p>{{ user.full_name }}</p>
                </div>

                <div class="info-row">
                    <label>Email</label>
                    <p>{{ user.email }}</p>
                </div>

                <div class="info-row">
                    <label>Phone</label>
                    <p>{{ user.phone }}</p>
                </div>

            </div>

            <div class="profile-actions">

                <a
                    href="{% url 'edit_profile' %}"
                    class="btn"
                >
                    Edit Profile
                </a>

            </div>

        </div>

    </div>

</body>
</html>
