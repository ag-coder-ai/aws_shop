{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | FashionHub</title>

<style>
  /* RESET CARD (shared design) */
.reset-container {
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
background:linear-gradient(135deg,#111827,#1f2937);
}

.reset-card {
background:white;
padding:40px;
width:100%;
max-width:450px;
border-radius:16px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
text-align:center;
}

/* SUB TEXT */
.sub-text {
font-size:13px;
color:#6b7280;
margin-bottom:20px;
}

/* INPUT */
.input-group {
margin-bottom:20px;
text-align:left;
}

.input-group label {
font-size:13px;
font-weight:600;
display:block;
margin-bottom:6px;
}

.input-group input {
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
outline:none;
transition:0.3s;
}

.input-group input:focus {
border-color:#f59e0b;
box-shadow:0 0 0 3px rgba(245,158,11,0.2);
}

/* PASSWORD BOX */
.password-box {
position:relative;
}

.password-box .toggle {
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

/* BUTTON */
.btn {
width:100%;
padding:12px;
background:#f59e0b;
border:none;
border-radius:8px;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

.btn:hover {
background:#111827;
color:white;
}

/* STRENGTH BAR */
.strength-bar {
height:6px;
background:#e5e7eb;
border-radius:10px;
margin-top:8px;
overflow:hidden;
}

.strength-bar .bar {
height:100%;
width:0%;
background:red;
transition:0.3s;
}

.strength-text {
font-size:12px;
margin-top:5px;
display:block;
}
</style>
<script>
  const passwordInput = document.querySelector("#id_new_password1");
const bar = document.querySelector(".bar");
const text = document.querySelector(".strength-text");

/* PASSWORD STRENGTH */
if (passwordInput) {

passwordInput.addEventListener("input", function () {

    let value = passwordInput.value;
    let strength = 0;

    if (value.length >= 8) strength++;
    if (/[A-Z]/.test(value)) strength++;
    if (/[a-z]/.test(value)) strength++;
    if (/\d/.test(value)) strength++;
    if (/[!@#$%^&*]/.test(value)) strength++;

    if (strength <= 2) {
        bar.style.width = "30%";
        bar.style.background = "red";
        text.innerText = "Weak Password";
    }
    else if (strength <= 4) {
        bar.style.width = "70%";
        bar.style.background = "orange";
        text.innerText = "Medium Password";
    }
    else {
        bar.style.width = "100%";
        bar.style.background = "green";
        text.innerText = "Strong Password";
    }

});

}

/* SHOW / HIDE PASSWORD */
document.querySelectorAll(".toggle").forEach(btn => {

btn.addEventListener("click", function () {

    let input = this.parentElement.querySelector("input");

    if (input.type === "password") {
        input.type = "text";
    } else {
        input.type = "password";
    }

});

});

</script>
</head>

<body>

<div class="reset-container">

    <div class="reset-card">

        <h2>Set New Password</h2>

        <p class="sub-text">
            Please enter a strong password to secure your account.
        </p>

        <form method="POST" id="resetForm">

            {% csrf_token %}

            <!-- PASSWORD 1 -->
            <div class="input-group">

                <label>New Password</label>

                <div class="password-box">

                    {{ form.new_password1 }}

                    <span class="toggle">👁</span>

                </div>

                <div class="strength-bar">
                    <div class="bar"></div>
                </div>

                <small class="strength-text"></small>

            </div>

            <!-- PASSWORD 2 -->
            <div class="input-group">

                <label>Confirm Password</label>

                <div class="password-box">

                    {{ form.new_password2 }}

                    <span class="toggle">👁</span>

                </div>

            </div>

            <!-- BUTTON -->
            <button type="submit" class="btn">
                Reset Password
            </button>

        </form>

    </div>

</div>

</body>

</html>
