{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | FashionHub</title>

<style>
    /* AUTH COMMON */
.auth-container {
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
background:linear-gradient(135deg,#111827,#1f2937);
padding:20px;
}

.auth-box {
background:white;
width:100%;
max-width:420px;
padding:40px;
border-radius:16px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
text-align:center;
animation: fadeUp 0.4s ease;
}

/* ICON */
.auth-icon {
font-size:40px;
margin-bottom:15px;
}

/* TEXT */
.auth-box h2 {
font-size:26px;
margin-bottom:10px;
color:#111827;
}

.sub-text {
font-size:14px;
color:#6b7280;
margin-bottom:25px;
line-height:1.6;
}

/* INPUT */
.input-group {
text-align:left;
margin-bottom:20px;
}

.input-group label {
display:block;
font-size:13px;
margin-bottom:6px;
font-weight:600;
}

.input-group input {
width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:8px;
outline:none;
transition:0.3s;
}

.input-group input:focus {
border-color:#f59e0b;
box-shadow:0 0 0 3px rgba(245,158,11,0.2);
}

/* BUTTON */
.auth-btn {
width:100%;
padding:12px;
background:#f59e0b;
border:none;
border-radius:8px;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

.auth-btn:hover {
background:#111827;
color:white;
}

/* BOTTOM TEXT */
.bottom-text {
margin-top:20px;
font-size:14px;
color:#6b7280;
}

.bottom-text a {
color:#f59e0b;
text-decoration:none;
font-weight:600;
}

/* ANIMATION */
@keyframes fadeUp {
from {
opacity:0;
transform:translateY(20px);
}
to {
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <!-- ICON -->
        <div class="auth-icon">
            🔒
        </div>

        <!-- TITLE -->
        <h2>Forgot Your Password?</h2>

        <p class="sub-text">
            Enter your registered email address and we’ll send you a link to reset your password.
        </p>

        <!-- FORM -->
        <form method="POST" class="auth-form">

            {% csrf_token %}

            <div class="input-group">

                <label>Email Address</label>

                {{ form.email }}

                <small class="error"></small>

            </div>

            <button type="submit" class="auth-btn">
                Send Reset Link
            </button>

        </form>

        <!-- BACK TO LOGIN -->
        <div class="bottom-text">

            Remember your password?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
