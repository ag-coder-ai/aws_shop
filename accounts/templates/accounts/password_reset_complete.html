{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Updated | FashionHub</title>

<style>
    /* SUCCESS PAGE */
.success-container {
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
background:linear-gradient(135deg,#111827,#1f2937);
}

.success-card {
background:white;
padding:40px;
max-width:420px;
width:100%;
text-align:center;
border-radius:16px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
animation: fadeUp 0.4s ease;
}

/* ICON */
.success-icon {
width:70px;
height:70px;
background:#16a34a;
color:white;
font-size:32px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
margin:0 auto 20px;
font-weight:bold;
}

/* TEXT */
.success-card h2 {
font-size:24px;
margin-bottom:10px;
color:#111827;
}

.success-card p {
font-size:14px;
color:#6b7280;
line-height:1.6;
margin-bottom:20px;
}

/* BUTTON */
.btn {
display:inline-block;
padding:12px 20px;
background:#f59e0b;
color:black;
text-decoration:none;
border-radius:8px;
font-weight:600;
transition:0.3s;
}

.btn:hover {
background:#111827;
color:white;
}

/* ANIMATION */
@keyframes fadeUp {
from {
opacity:0;
transform:translateY(20px);
}
to {
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<div class="success-container">

    <div class="success-card">

        <!-- SUCCESS ICON -->
        <div class="success-icon">
            ✓
        </div>

        <!-- TITLE -->
        <h2>Password Reset Successful</h2>

        <!-- MESSAGE -->
        <p>
            Your password has been updated successfully.
            You can now login with your new password.
        </p>

        <!-- ACTION BUTTON -->
        <a href="{% url 'login' %}" class="btn">
            Login Now
        </a>

    </div>

</div>

</body>

</html>
